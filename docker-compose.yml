version: "3.9"

services:
  db:
    image: postgres:15
    container_name: tower-db
    restart: always
    environment:
      POSTGRES_USER: tower
      POSTGRES_PASSWORD: tower
      POSTGRES_DB: tower
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: 